    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    </div>

    <main class="page">
      <section class="card" id="login-card" aria-labelledby="form-title">
        <h1 id="form-title">Login</h1>

        <form id="login-form" novalidate>
          <label class="field">
            <span>Email</span>
            <input type="email" name="email" autocomplete="email" required />
          </label>

          <label class="field">
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required />
          </label>

          <div class="row">
            <label class="remember">
              <input type="checkbox" name="remember" />
              <span>Remember Me</span>
            </label>
            <button type="button" class="text-link" id="forgot-btn">Forget Password</button>
          </div>

          <button type="submit" class="submit">Log in</button>
        </form>

        <p class="switch">
          Don't have a account
          <button type="button" class="text-link strong" id="show-register">Register</button>
        </p>
      </section>

      <section class="card hidden" id="register-card" aria-labelledby="register-title">
        <h1 id="register-title">Register</h1>
        <form id="register-form" novalidate>
          <label class="field">
            <span>Email</span>
            <input type="email" name="email" autocomplete="email" required />
          </label>
          <label class="field">
            <span>Password</span>
            <input type="password" name="password" autocomplete="new-password" required minlength="6" />
          </label>
          <label class="field">
            <span>Confirm Password</span>
            <input type="password" name="confirm" autocomplete="new-password" required />
          </label>
          <button type="submit" class="submit">Create account</button>
        </form>
        <p class="switch">
          Already have an account
          <button type="button" class="text-link strong" id="show-login">Log in</button>
        </p>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
